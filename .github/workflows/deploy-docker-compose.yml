name: Deploy by Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "เลือก Docker Compose Version"
        required: true
        type: choice
        options:
          - version1.0
          - version2.0
          - version3.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v3

      - name: 🚀 Deploy version ${{ github.event.inputs.version }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # ❗ หยุด script ถ้าเจอ error

            VERSION=${{ github.event.inputs.version }}
            echo "📦 Deploying version: $VERSION"

            # เคลียร์โฟลเดอร์เก่าและ clone repo ใหม่
            rm -rf ~/docker-deploy
            mkdir -p ~/docker-deploy
            git clone https://github.com/${{ github.repository }}.git ~/docker-deploy
            cd ~/docker-deploy
            git checkout ${{ github.ref_name }}

            # เข้าไปยังโฟลเดอร์ของ docker-compose เวอร์ชันนั้น
            cd docker-compose/$VERSION

            # ปิด container เก่าและ clean orphan
            docker-compose down --remove-orphans

            # ดึง image ใหม่ + deploy
            docker-compose pull
            docker-compose up -d --build

            echo "✅ Deploy version $VERSION เสร็จสิ้นเรียบร้อย"
